# Builds the Windows app and the Android APK every time you push to GitHub
# (or when you press "Run workflow" on the Actions tab).
# Download the results from the run's "Artifacts" section.
name: Build Heat-Bits

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.27.4"

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Generate the Android project files
        run: flutter create --platforms=android,windows --org com.heatbits --project-name heat_bits .
      - run: dart run tool/prepare.dart
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter test
      - run: flutter build apk --release
      - name: Name the APK
        run: cp build/app/outputs/flutter-apk/app-release.apk Heat-Bits.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Heat-Bits-Android
          path: Heat-Bits.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Generate the Windows project files
        run: flutter create --platforms=android,windows --org com.heatbits --project-name heat_bits .
      - run: dart run tool/prepare.dart
      - run: flutter pub get
      - run: dart run flutter_launcher_icons
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: Heat-Bits-Windows
          path: build/windows/x64/runner/Release/
