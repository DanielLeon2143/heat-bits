name: heat_bits
description: "Heat-Bits — habit heat maps, calendar and to-dos. Windows + Android, synced over your Wi-Fi."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # shows the shared Heat-Bits interface (assets/web/index.html) on Windows and Android.
  # 6.2 beta: the 6.1.x Android part no longer builds with the current Android Gradle Plugin
  flutter_inappwebview: 6.2.0-beta.3
  # where the app keeps its data file
  path_provider: ^2.1.5
  # pairing QR code (drawn on the PC) and scanner (on the phone)
  qr: ^3.0.2
  mobile_scanner: ^7.4.2
  # "Export" on Android opens the share sheet
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.2
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/web/

flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: true
  ios: false
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 256
